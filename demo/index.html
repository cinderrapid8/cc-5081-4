<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>近战格挡/招架裁决演示</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 16px; background: #0b0e13; color: #e6e6e6;
    font: 13px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 17px; margin: 0 0 10px; }
  .layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  canvas { background: #10141b; border: 1px solid #232a36; border-radius: 8px; }
  .panel { width: 340px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: #151a22; border: 1px solid #232a36; border-radius: 8px; padding: 10px 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: #9fc3ff; }
  .row { display: flex; justify-content: space-between; gap: 8px; margin: 3px 0; }
  .muted { color: #8a93a2; }
  table { width: 100%; border-collapse: collapse; font: 11px monospace; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #232a36; }
  select, button {
    background: #1d2430; color: #e6e6e6; border: 1px solid #313a49;
    border-radius: 6px; padding: 5px 9px; font-size: 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: #4a6ea3; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  kbd {
    background: #232a36; border-radius: 4px; padding: 1px 5px;
    font: 11px monospace; border: 1px solid #313a49;
  }
  #hud-log { max-height: 130px; overflow: auto; font-size: 11px; }
</style>
</head>
<body>
  <h1>近战竞技 · 格挡 / 招架 / 受击裁决演示</h1>
  <div class="layout">
    <div>
      <div class="controls" style="margin-bottom:8px">
        <label>场景
          <select id="scenario-select">
            <option value="A">A · 前后方同时到达</option>
            <option value="B">B · 长持续接触</option>
            <option value="C">C · 窗口边缘</option>
            <option value="D">D · 换装 / 退出姿态</option>
            <option value="M">M · 手动操控</option>
          </select>
        </label>
        <button id="btn-play">播放</button>
        <button id="btn-pause">暂停</button>
        <button id="btn-reset">重置</button>
        <label>渲染频率
          <select id="render-rate">
            <option value="16.7">60 FPS</option>
            <option value="33.3">30 FPS</option>
            <option value="50">20 FPS</option>
            <option value="100">10 FPS</option>
            <option value="250">4 FPS</option>
          </select>
        </label>
        <span id="rate-label" class="muted">16.7ms/帧（仅画面）</span>
      </div>
      <canvas id="stage" width="720" height="620"></canvas>
    </div>

    <div class="panel">
      <div class="card">
        <h2 id="scenario-title">—</h2>
        <div class="row"><span class="muted">逻辑时间</span><strong id="hud-time">0 ms</strong></div>
        <div class="row"><span class="muted">装备</span><span id="hud-gear"></span></div>
        <div class="row"><span class="muted">姿态</span><span id="hud-guard"></span></div>
        <div class="row"><span class="muted">精准招架窗口剩余</span><span id="hud-window"></span></div>
        <div class="row"><span class="muted">朝向</span><span id="hud-facing"></span></div>
      </div>

      <div class="card">
        <h2>裁决（画面十字标记 = 被采用的判定时刻）</h2>
        <table>
          <thead><tr><th>攻击编号</th><th>结果</th><th>判定时刻</th><th>独立预期</th></tr></thead>
          <tbody id="hud-verdicts"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>事件日志</h2>
        <div id="hud-log"></div>
      </div>

      <div class="card">
        <h2>手动操控</h2>
        <div class="muted">
          <kbd>空格</kbd> 按住防御（松开立即退出姿态）<br/>
          <kbd>A</kbd>/<kbd>D</kbd> 或方向键转向<br/>
          <kbd>1</kbd>徒手 <kbd>2</kbd>小圆盾 <kbd>3</kbd>迅捷剑 <kbd>4</kbd>塔盾<br/>
          <kbd>G</kbd> 只播放防御动作动画、不进入姿态（不会产生招架）
        </div>
      </div>
    </div>
  </div>

  <script src="../src/adjudicator.js"></script>
  <script src="../src/simulation.js"></script>
  <script src="../src/scenarios.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>
</body>
</html>
